[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "london" # Mezo: no PUSH0 / MCOPY / transient storage
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[fmt]
line_length = 120

[rpc_endpoints]
mezo_testnet = "${MEZO_TESTNET_RPC_URL}"
